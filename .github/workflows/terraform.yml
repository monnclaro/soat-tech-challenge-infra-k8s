name: Terraform - Infra Kubernetes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# AWS Academy: credenciais de sessão temporárias (expiram com o Lab), não
# suporta OIDC nem IAM role de longa duração — ver README > "AWS Academy".
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_DEFAULT_REGION: us-east-1

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4.2.2

      # AWS Academy reseta a conta entre sessões — bucket/tabela do backend
      # remoto do Terraform (compartilhado entre infra-k8s/infra-database/
      # lambda) podem não existir ainda. Idempotente: só cria o que faltar.
      - name: Bootstrap do backend remoto (S3 + DynamoDB)
        run: |
          BUCKET="soat-tech-challenge-tfstate"
          TABLE="soat-tech-challenge-tfstate-lock"

          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region us-east-1
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
          fi

          if ! aws dynamodb describe-table --table-name "$TABLE" --region us-east-1 >/dev/null 2>&1; then
            aws dynamodb create-table --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region us-east-1
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan -input=false -no-color \
            -var="lab_role_arn=${{ secrets.AWS_LAB_ROLE_ARN }}" \
            -var="new_relic_license_key=${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
            -var="new_relic_account_id=${{ secrets.NEW_RELIC_ACCOUNT_ID }}" \
            -var="new_relic_api_key=${{ secrets.NEW_RELIC_API_KEY }}" \
            -var="new_relic_notification_email=${{ secrets.NEW_RELIC_NOTIFICATION_EMAIL }}" \
            -out=tfplan

  apply:
    name: Apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment: producao
    steps:
      - uses: actions/checkout@v4.2.2

      # AWS Academy reseta a conta entre sessões — bucket/tabela do backend
      # remoto do Terraform (compartilhado entre infra-k8s/infra-database/
      # lambda) podem não existir ainda. Idempotente: só cria o que faltar.
      - name: Bootstrap do backend remoto (S3 + DynamoDB)
        run: |
          BUCKET="soat-tech-challenge-tfstate"
          TABLE="soat-tech-challenge-tfstate-lock"

          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region us-east-1
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
          fi

          if ! aws dynamodb describe-table --table-name "$TABLE" --region us-east-1 >/dev/null 2>&1; then
            aws dynamodb create-table --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region us-east-1
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve -input=false \
            -var="lab_role_arn=${{ secrets.AWS_LAB_ROLE_ARN }}" \
            -var="new_relic_license_key=${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
            -var="new_relic_account_id=${{ secrets.NEW_RELIC_ACCOUNT_ID }}" \
            -var="new_relic_api_key=${{ secrets.NEW_RELIC_API_KEY }}" \
            -var="new_relic_notification_email=${{ secrets.NEW_RELIC_NOTIFICATION_EMAIL }}"

      - name: Atualizar kubeconfig e checar nodes
        run: |
          aws eks update-kubeconfig --name soat-producao --region us-east-1
          kubectl get nodes
