name: Terraform - Infra Kubernetes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Sem isso, merges em sequência rápida disparavam applies sobrepostos, cada um
# brigando pelo lock do DynamoDB do mesmo state — um deles sempre falhava com
# "Error acquiring the state lock", às vezes deixando o lock preso (run
# cancelado/interrompido no meio) e travando TODOS os applies seguintes até
# alguém apagar o item manualmente. Com isto, só roda um apply por vez — os
# outros esperam na fila em vez de colidir.
concurrency:
  group: terraform-infra-k8s
  cancel-in-progress: false

# AWS Academy: credenciais de sessão temporárias (expiram com o Lab), não
# suporta OIDC nem IAM role de longa duração — ver README > "AWS Academy".
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_DEFAULT_REGION: us-east-1

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4.2.2

      # AWS Academy reseta a conta entre sessões — o bucket "-augusto" original
      # ficou órfão (de uma sessão/conta anterior, inacessível agora). Sufixo
      # "-augusto-2": idempotente, só cria o que faltar.
      - name: Bootstrap do backend remoto (S3 + DynamoDB)
        run: |
          BUCKET="soat-tech-challenge-tfstate-augusto-2"
          TABLE="soat-tech-challenge-tfstate-lock-augusto-2"

          # || true: outro repo (infra-database/lambda) pode estar criando o
          # mesmo bucket/tabela ao mesmo tempo — o create falha com "already
          # exists"/"ResourceInUseException", mas o wait abaixo garante que
          # seguimos só depois do recurso existir de verdade, não importa quem criou.
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region us-east-1 || true
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true || true
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled || true
          fi
          aws s3api wait bucket-exists --bucket "$BUCKET"

          if ! aws dynamodb describe-table --table-name "$TABLE" --region us-east-1 >/dev/null 2>&1; then
            aws dynamodb create-table --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region us-east-1 || true
          fi
          aws dynamodb wait table-exists --table-name "$TABLE" --region us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan -input=false -no-color -lock-timeout=5m \
            -var="lab_role_arn=${{ secrets.AWS_LAB_ROLE_ARN }}" \
            -var="new_relic_license_key=${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
            -var="new_relic_account_id=${{ secrets.NEW_RELIC_ACCOUNT_ID }}" \
            -var="new_relic_api_key=${{ secrets.NEW_RELIC_API_KEY }}" \
            -var="new_relic_notification_email=${{ secrets.NEW_RELIC_NOTIFICATION_EMAIL }}" \
            -out=tfplan

  apply:
    name: Apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment: producao
    steps:
      - uses: actions/checkout@v4.2.2

      # AWS Academy reseta a conta entre sessões — o bucket "-augusto" original
      # ficou órfão (de uma sessão/conta anterior, inacessível agora). Sufixo
      # "-augusto-2": idempotente, só cria o que faltar.
      - name: Bootstrap do backend remoto (S3 + DynamoDB)
        run: |
          BUCKET="soat-tech-challenge-tfstate-augusto-2"
          TABLE="soat-tech-challenge-tfstate-lock-augusto-2"

          # || true: outro repo (infra-database/lambda) pode estar criando o
          # mesmo bucket/tabela ao mesmo tempo — o create falha com "already
          # exists"/"ResourceInUseException", mas o wait abaixo garante que
          # seguimos só depois do recurso existir de verdade, não importa quem criou.
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region us-east-1 || true
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true || true
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled || true
          fi
          aws s3api wait bucket-exists --bucket "$BUCKET"

          if ! aws dynamodb describe-table --table-name "$TABLE" --region us-east-1 >/dev/null 2>&1; then
            aws dynamodb create-table --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region us-east-1 || true
          fi
          aws dynamodb wait table-exists --table-name "$TABLE" --region us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        run: terraform init -input=false

      # Corrige o drift de state causado por reset do AWS Academy (apaga EC2/EKS, que
      # custam, mas não o SSM Parameter Store, que é gratuito): esses 10 parâmetros já
      # existem de verdade na AWS, mas o state não sabia disso, e o apply falhava com
      # "ParameterAlreadyExists" ao tentar criá-los de novo.
      #
      # "terraform import" (tentado antes) NÃO funciona aqui: ele exige resolver a
      # configuração de TODOS os providers do projeto antes de importar qualquer coisa,
      # inclusive "kubernetes"/"helm" — que dependem do cluster EKS ainda nem existir
      # nesse ponto ("Invalid provider configuration ... depends on values that cannot
      # be determined until apply"). É uma limitação do "import" em si, não tem como
      # contornar só com "-target". O "apply" normal não tem esse problema (ele resolve
      # os providers na ordem certa conforme cria cada recurso) — por isso a correção é
      # deletar os parâmetros órfãos direto via AWS CLI antes do apply, deixando o
      # Terraform recriá-los do zero com os valores certos (já confirmado que funciona:
      # o apply sempre passou de EKS/RabbitMQ sem problema, só travava nesses 10 no final).
      - name: Remover parâmetros SSM órfãos (corrige drift de state)
        run: |
          remover() { aws ssm delete-parameter --name "$1" || true; }

          remover /soat/producao/eks/cluster-name
          remover /soat/producao/eks/cluster-endpoint
          remover /soat/producao/jwt/secret
          remover /soat/producao/network/vpc-id
          remover /soat/producao/network/private-subnet-ids
          remover /soat/producao/network/eks-node-sg-id
          remover /soat/producao/network/vpc-cidr
          remover /soat/producao/rabbitmq/host
          remover /soat/producao/rabbitmq/username
          remover /soat/producao/rabbitmq/password

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve -input=false -lock-timeout=5m \
            -var="lab_role_arn=${{ secrets.AWS_LAB_ROLE_ARN }}" \
            -var="new_relic_license_key=${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
            -var="new_relic_account_id=${{ secrets.NEW_RELIC_ACCOUNT_ID }}" \
            -var="new_relic_api_key=${{ secrets.NEW_RELIC_API_KEY }}" \
            -var="new_relic_notification_email=${{ secrets.NEW_RELIC_NOTIFICATION_EMAIL }}"

      - name: Atualizar kubeconfig e checar nodes
        run: |
          aws eks update-kubeconfig --name soat-producao --region us-east-1
          kubectl get nodes
